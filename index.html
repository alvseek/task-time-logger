<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Tracker</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <h1>Time Tracker</h1>

  <div class="row">
    <input id="task" type="text" placeholder="Add a task to your list…" autocomplete="off" aria-label="New task name">
    <button id="addtask" type="button">Add task</button>
  </div>

  <h2>Open tasks</h2>
  <table>
    <thead>
      <tr>
        <th>Task</th>
        <th class="num">Time</th>
        <th class="action"></th>
      </tr>
    </thead>
    <tbody id="taskrows"></tbody>
  </table>
  <div id="tasksempty" class="empty">No open tasks — add one above.</div>

  <div class="toolbar">
    <button id="addman" type="button" aria-controls="manual" aria-expanded="false">Add manually</button>
    <button id="clear" type="button">Clear all</button>
    <span id="status"></span>
  </div>

  <div class="row manual" id="manual" hidden>
    <input id="when" type="datetime-local" aria-label="When this task happened">
    <input id="minutes" type="number" min="1" step="1" inputmode="numeric" placeholder="Minutes" aria-label="How long it took, in minutes">
    <button id="add" type="button">Add</button>
  </div>

  <h2>Archived</h2>
  <div class="toolbar filterbar">
    <label>From <input id="from" type="date" aria-label="Show archived work from this date"></label>
    <label>To <input id="to" type="date" aria-label="Show archived work up to this date"></label>
    <button id="copy" type="button">Copy for Excel</button>
    <span id="archcount"></span>
  </div>

  <table>
    <thead>
      <tr>
        <th>Task</th>
        <th class="num">Date</th>
        <th class="num">Start</th>
        <th class="num">Stop</th>
        <th class="num">Duration</th>
        <th class="action"></th>
      </tr>
    </thead>
    <tbody id="archrows"></tbody>
  </table>
  <div id="archempty" class="empty">Nothing archived yet — finish a task with Done, or log a past one with Add manually.</div>
</main>

<script src="js/utils/format.js"></script>
<script src="js/models/Session.js"></script>
<script src="js/models/Task.js"></script>
<script src="js/store/TaskStore.js"></script>
<script src="js/views/TaskListView.js"></script>
<script src="js/views/ArchiveView.js"></script>
<script src="js/app.js"></script>
</body>
</html>
