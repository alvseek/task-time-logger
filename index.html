<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Tracker</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f5f6f8; color: #1a1d21;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 900px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h2 { font-size: 15px; margin: 24px 0 8px; color: #4b5563; }
  .row { display: flex; gap: 8px; }
  input[type="text"], input[type="datetime-local"], input[type="number"], input[type="date"] {
    flex: 1; min-width: 0; padding: 12px 14px; font-size: 16px;
    border: 1px solid #c8ccd2; border-radius: 8px; background: #fff; color: inherit;
  }
  input[type="text"]:focus, input[type="datetime-local"]:focus, input[type="number"]:focus, input[type="date"]:focus { outline: 2px solid #3b82f6; outline-offset: -1px; }
  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 8px;
    padding: 12px 20px; font-weight: 600; font-size: 15px;
  }
  #addtask { background: #3b82f6; color: #fff; min-width: 110px; }
  .toolbar { display: flex; gap: 8px; margin: 20px 0 8px; align-items: center; flex-wrap: wrap; }
  .toolbar button { background: #e5e7eb; color: #1a1d21; padding: 8px 14px; font-size: 14px; }
  .toolbar button:disabled { opacity: 0.5; cursor: default; }
  #status { font-size: 14px; color: #6b7280; margin-left: auto; white-space: nowrap; }
  .filterbar { margin: 8px 0; }
  .filterbar label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #6b7280; }
  .filterbar input[type="date"] { flex: 0 0 auto; padding: 8px 10px; font-size: 14px; }
  .row[hidden] { display: none; }
  .manual { margin-bottom: 8px; }
  .manual input[type="datetime-local"] { flex: 1.6; }
  .manual button { background: #3b82f6; color: #fff; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; margin-bottom: 4px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eceef1; font-size: 14px; }
  th { background: #f0f1f4; font-weight: 600; }
  td.num, th.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.action, th.action { width: 1%; text-align: right; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  .del, .edit, .restore { background: none; color: #9ca3af; padding: 4px 6px; font-size: 16px; line-height: 1; font-weight: 600; }
  .del:hover { color: #dc2626; }
  .edit:hover { color: #3b82f6; }
  .restore:hover { color: #16a34a; }
  .toggle { background: #16a34a; color: #fff; padding: 6px 12px; font-size: 13px; margin-right: 4px; }
  .toggle.stop { background: #dc2626; }
  .toggle:disabled { background: #cbd5e1; cursor: default; opacity: 0.7; }
  .donebtn { background: #e5e7eb; color: #1a1d21; padding: 6px 12px; font-size: 13px; }
  .donebtn:disabled { opacity: 0.5; cursor: default; }
  .empty { padding: 18px; text-align: center; color: #9ca3af; font-size: 14px; }
  .editrow td { background: #f7f9fb; }
  .editfields { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .editfields input { min-width: 160px; }
  .editfields input[type="datetime-local"] { flex: 1; }
  .editdur { font-size: 14px; color: #6b7280; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .editfields button { background: #3b82f6; color: #fff; padding: 10px 16px; font-size: 14px; }
  .editfields button.cancel { background: #e5e7eb; color: #1a1d21; }
  @media (prefers-color-scheme: dark) {
    body { background: #16181c; color: #e6e8eb; }
    h2 { color: #9ca3af; }
    input[type="text"], input[type="datetime-local"], input[type="number"], input[type="date"] { background: #1e2126; border-color: #34383f; }
    table { background: #1e2126; }
    th { background: #24272d; }
    th, td { border-color: #2b2f35; }
    .toolbar button { background: #2b2f35; color: #e6e8eb; }
    .donebtn { background: #2b2f35; color: #e6e8eb; }
    .toggle:disabled { background: #34383f; }
    .editrow td { background: #191c21; }
    .editfields button.cancel { background: #2b2f35; color: #e6e8eb; }
  }
</style>
</head>
<body>
<main>
  <h1>Time Tracker</h1>

  <div class="row">
    <input id="task" type="text" placeholder="Add a task to your list…" autocomplete="off" aria-label="New task name">
    <button id="addtask" type="button">Add task</button>
  </div>

  <h2>Open tasks</h2>
  <table>
    <thead>
      <tr>
        <th>Task</th>
        <th class="num">Time</th>
        <th class="action"></th>
      </tr>
    </thead>
    <tbody id="taskrows"></tbody>
  </table>
  <div id="tasksempty" class="empty">No open tasks — add one above.</div>

  <div class="toolbar">
    <button id="addman" type="button" aria-controls="manual" aria-expanded="false">Add manually</button>
    <button id="clear" type="button">Clear all</button>
    <span id="status"></span>
  </div>

  <div class="row manual" id="manual" hidden>
    <input id="when" type="datetime-local" aria-label="When this task happened">
    <input id="minutes" type="number" min="1" step="1" inputmode="numeric" placeholder="Minutes" aria-label="How long it took, in minutes">
    <button id="add" type="button">Add</button>
  </div>

  <h2>Archived</h2>
  <div class="toolbar filterbar">
    <label>From <input id="from" type="date" aria-label="Show archived work from this date"></label>
    <label>To <input id="to" type="date" aria-label="Show archived work up to this date"></label>
    <button id="copy" type="button">Copy for Excel</button>
    <span id="archcount"></span>
  </div>

  <table>
    <thead>
      <tr>
        <th>Task</th>
        <th class="num">Date</th>
        <th class="num">Start</th>
        <th class="num">Stop</th>
        <th class="num">Duration</th>
        <th class="action"></th>
      </tr>
    </thead>
    <tbody id="archrows"></tbody>
  </table>
  <div id="archempty" class="empty">Nothing archived yet — finish a task with Done, or log a past one with Add manually.</div>
</main>

<script>
(function () {
  'use strict';

  var TASKS_KEY = 'time-tracker.tasks.v2';
  var RUNNING_KEY = 'time-tracker.running.v2';
  var LEGACY_ENTRIES_KEY = 'time-tracker.entries.v1';

  var taskInput = document.getElementById('task');
  var addTaskBtn = document.getElementById('addtask');
  var taskRowsBody = document.getElementById('taskrows');
  var tasksEmpty = document.getElementById('tasksempty');
  var statusEl = document.getElementById('status');
  var clearBtn = document.getElementById('clear');
  var addManBtn = document.getElementById('addman');
  var manualPanel = document.getElementById('manual');
  var whenInput = document.getElementById('when');
  var minutesInput = document.getElementById('minutes');
  var addBtn = document.getElementById('add');
  var fromInput = document.getElementById('from');
  var toInput = document.getElementById('to');
  var copyBtn = document.getElementById('copy');
  var archRowsBody = document.getElementById('archrows');
  var archEmpty = document.getElementById('archempty');
  var archCount = document.getElementById('archcount');

  var tasks = loadTasks();
  var running = read(RUNNING_KEY, null);
  if (running && (!running.taskId || !isOpen(running.taskId))) running = null;

  var MESSAGE_HOLD_MS = 2000;
  var statusHoldUntil = 0;
  var renamingId = null;
  var renameDraft = '';
  var sessionEdit = null; // { taskId, sessionId, draft: { name, start, stop } }
  var runningTimeCell = null;

  function read(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (err) {
      return fallback;
    }
  }

  function write() {
    try {
      localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));
      localStorage.setItem(RUNNING_KEY, JSON.stringify(running));
    } catch (err) {
      setStatus('Could not save (storage blocked)');
    }
  }

  function loadTasks() {
    var raw = null;
    try { raw = localStorage.getItem(TASKS_KEY); } catch (err) { raw = null; }
    if (raw !== null) {
      // The key exists, so migration already happened (or the store is corrupt).
      // Never re-migrate here — that would resurrect the legacy log as duplicates.
      try {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      } catch (err) {}
      return [];
    }

    var migrated = [];
    var legacy = read(LEGACY_ENTRIES_KEY, null);
    if (Array.isArray(legacy)) {
      legacy.forEach(function (entry) {
        if (!entry || typeof entry !== 'object') return;
        var start = Number(entry.start);
        var stop = Number(entry.stop);
        if (!isFinite(start) || !isFinite(stop) || stop <= start) return;
        migrated.push({
          id: uid(),
          name: clean(entry.task) || 'Untitled task',
          status: 'done',
          createdAt: start,
          doneAt: stop,
          sessions: [{ id: uid(), start: start, stop: stop }]
        });
      });
    }
    try { localStorage.setItem(TASKS_KEY, JSON.stringify(migrated)); } catch (err) {}
    return migrated;
  }

  function uid() {
    if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function fmtInput(ms) {
    var d = new Date(ms);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function nowValue() { return fmtInput(Date.now()).slice(0, 16); }

  function fmtDateTime(ms) {
    var d = new Date(ms);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function dateStr(ms) {
    var d = new Date(ms);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function fmtDuration(ms) {
    var total = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(total / 3600);
    var m = Math.floor((total % 3600) / 60);
    var s = total % 60;
    return pad(h) + ':' + pad(m) + ':' + pad(s);
  }

  function clean(text) {
    return String(text).replace(/[\t\r\n]+/g, ' ').trim();
  }

  function parseLocal(value) {
    return value ? new Date(value).getTime() : NaN;
  }

  function findTask(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) return tasks[i];
    }
    return null;
  }

  function isOpen(id) {
    var task = findTask(id);
    return !!task && task.status !== 'done';
  }

  function openTasks() {
    return tasks.filter(function (task) { return task.status !== 'done'; });
  }

  function doneTasks() {
    return tasks.filter(function (task) { return task.status === 'done'; });
  }

  function taskTotal(task, nowMs) {
    var total = 0;
    task.sessions.forEach(function (s) { total += (s.stop - s.start); });
    if (running && running.taskId === task.id) total += (nowMs - running.start);
    return total;
  }

  function passesFilter(ms) {
    var d = dateStr(ms);
    if (fromInput.value && d < fromInput.value) return false;
    if (toInput.value && d > toInput.value) return false;
    return true;
  }

  function archivedRows() {
    var rows = [];
    doneTasks().forEach(function (task) {
      task.sessions.forEach(function (session) {
        if (passesFilter(session.start)) rows.push({ task: task, session: session });
      });
    });
    rows.sort(function (a, b) { return b.session.start - a.session.start; });
    return rows;
  }

  function render() {
    renderTasks();
    renderArchived();
    updateRunningUI();
  }

  function renderTasks() {
    taskRowsBody.textContent = '';
    runningTimeCell = null;

    var list = openTasks().sort(function (a, b) { return b.createdAt - a.createdAt; });
    var now = Date.now();

    list.forEach(function (task) {
      var isRunning = !!running && running.taskId === task.id;
      var tr = document.createElement('tr');

      var nameCell = document.createElement('td');
      nameCell.textContent = task.name;
      tr.appendChild(nameCell);

      var timeCell = document.createElement('td');
      timeCell.className = 'num';
      timeCell.textContent = fmtDuration(taskTotal(task, now));
      if (isRunning) runningTimeCell = timeCell;
      tr.appendChild(timeCell);

      var actionCell = document.createElement('td');
      actionCell.className = 'action';

      var toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'toggle';
      if (isRunning) {
        toggle.textContent = 'Stop';
        toggle.classList.add('stop');
        toggle.title = 'Stop timing this task';
      } else {
        toggle.textContent = 'Start';
        toggle.disabled = !!running;
        toggle.title = running ? 'Stop the running task first' : 'Start timing this task';
      }
      toggle.addEventListener('click', function () {
        if (running && running.taskId === task.id) { stopTimer(); } else { startTimer(task.id); }
      });
      actionCell.appendChild(toggle);

      var done = document.createElement('button');
      done.type = 'button';
      done.className = 'donebtn';
      done.textContent = 'Done';
      if (task.sessions.length === 0 && !isRunning) {
        done.disabled = true;
        done.title = 'Start the task first — there is no time to archive';
      } else {
        done.title = 'Mark done and archive';
      }
      done.addEventListener('click', function () { markDone(task.id); });
      actionCell.appendChild(done);

      var edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'edit';
      edit.title = 'Rename this task';
      edit.setAttribute('aria-label', 'Rename this task');
      edit.textContent = '\u270e';
      edit.addEventListener('click', function () { openRename(task.id); });
      actionCell.appendChild(edit);

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.title = 'Delete this task';
      del.setAttribute('aria-label', 'Delete this task');
      del.textContent = '\u00d7';
      del.addEventListener('click', function () { deleteTask(task.id); });
      actionCell.appendChild(del);

      tr.appendChild(actionCell);
      taskRowsBody.appendChild(tr);

      if (renamingId === task.id) taskRowsBody.appendChild(renameRow(task));
    });

    tasksEmpty.style.display = list.length === 0 ? 'block' : 'none';
  }

  function renderArchived() {
    archRowsBody.textContent = '';

    var rows = archivedRows();
    rows.forEach(function (pair) {
      var task = pair.task;
      var session = pair.session;

      var tr = document.createElement('tr');

      var taskCell = document.createElement('td');
      taskCell.textContent = task.name;
      tr.appendChild(taskCell);

      var dateCell = document.createElement('td');
      dateCell.className = 'num';
      dateCell.textContent = dateStr(session.start);
      tr.appendChild(dateCell);

      var startCell = document.createElement('td');
      startCell.className = 'num';
      startCell.textContent = fmtDateTime(session.start);
      tr.appendChild(startCell);

      var stopCell = document.createElement('td');
      stopCell.className = 'num';
      stopCell.textContent = fmtDateTime(session.stop);
      tr.appendChild(stopCell);

      var durCell = document.createElement('td');
      durCell.className = 'num';
      durCell.textContent = fmtDuration(session.stop - session.start);
      tr.appendChild(durCell);

      var actionCell = document.createElement('td');
      actionCell.className = 'action';

      var restore = document.createElement('button');
      restore.type = 'button';
      restore.className = 'restore';
      restore.title = 'Restore this task to the open list';
      restore.setAttribute('aria-label', 'Restore this task');
      restore.textContent = '\u21a9';
      restore.addEventListener('click', function () { restoreTask(task.id); });
      actionCell.appendChild(restore);

      var edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'edit';
      edit.title = 'Edit this entry';
      edit.setAttribute('aria-label', 'Edit this entry');
      edit.textContent = '\u270e';
      edit.addEventListener('click', function () { openSessionEdit(task.id, session.id); });
      actionCell.appendChild(edit);

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.title = 'Delete this entry';
      del.setAttribute('aria-label', 'Delete this entry');
      del.textContent = '\u00d7';
      del.addEventListener('click', function () { deleteSession(task.id, session.id); });
      actionCell.appendChild(del);

      tr.appendChild(actionCell);
      archRowsBody.appendChild(tr);

      if (sessionEdit && sessionEdit.sessionId === session.id) {
        archRowsBody.appendChild(sessionEditRow(task, session));
      }
    });

    archEmpty.style.display = rows.length === 0 ? 'block' : 'none';
    archCount.textContent = rows.length + (rows.length === 1 ? ' row' : ' rows');
  }

  function renameRow(task) {
    var tr = document.createElement('tr');
    tr.className = 'editrow renamerow';

    var cell = document.createElement('td');
    cell.colSpan = 3;

    var fields = document.createElement('div');
    fields.className = 'editfields';

    var box = document.createElement('input');
    box.type = 'text';
    box.value = renameDraft;
    box.setAttribute('aria-label', 'Task name');
    box.addEventListener('input', function () { renameDraft = box.value; });

    var save = document.createElement('button');
    save.type = 'button';
    save.textContent = 'Save';
    save.addEventListener('click', function () { saveRename(task.id); });

    var cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.className = 'cancel';
    cancel.textContent = 'Cancel';
    cancel.addEventListener('click', cancelRename);

    fields.appendChild(box);
    fields.appendChild(save);
    fields.appendChild(cancel);
    cell.appendChild(fields);
    tr.appendChild(cell);

    tr.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        if (event.target.tagName === 'BUTTON') return;
        event.preventDefault();
        saveRename(task.id);
      } else if (event.key === 'Escape') {
        event.preventDefault();
        cancelRename();
      }
    });

    return tr;
  }

  function sessionEditRow(task, session) {
    var tr = document.createElement('tr');
    tr.className = 'editrow sessrow';

    var cell = document.createElement('td');
    cell.colSpan = 6;

    var fields = document.createElement('div');
    fields.className = 'editfields';

    var dur = document.createElement('span');
    dur.className = 'editdur';

    function refresh() {
      var a = parseLocal(sessionEdit.draft.start);
      var b = parseLocal(sessionEdit.draft.stop);
      dur.textContent = (isNaN(a) || isNaN(b) || b <= a) ? '\u2014' : fmtDuration(b - a);
    }

    var nameBox = document.createElement('input');
    nameBox.type = 'text';
    nameBox.value = sessionEdit.draft.name;
    nameBox.setAttribute('aria-label', 'Task name');
    nameBox.addEventListener('input', function () { sessionEdit.draft.name = nameBox.value; });

    function timeBox(label, key) {
      var box = document.createElement('input');
      box.type = 'datetime-local';
      box.step = '1';
      box.value = sessionEdit.draft[key];
      box.setAttribute('aria-label', label);
      box.addEventListener('input', function () {
        sessionEdit.draft[key] = box.value;
        refresh();
      });
      return box;
    }

    var save = document.createElement('button');
    save.type = 'button';
    save.textContent = 'Save';
    save.addEventListener('click', function () { saveSessionEdit(); });

    var cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.className = 'cancel';
    cancel.textContent = 'Cancel';
    cancel.addEventListener('click', cancelSessionEdit);

    fields.appendChild(nameBox);
    fields.appendChild(timeBox('Start time', 'start'));
    fields.appendChild(timeBox('Stop time', 'stop'));
    fields.appendChild(dur);
    fields.appendChild(save);
    fields.appendChild(cancel);
    cell.appendChild(fields);
    tr.appendChild(cell);

    tr.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        if (event.target.tagName === 'BUTTON') return;
        event.preventDefault();
        saveSessionEdit();
      } else if (event.key === 'Escape') {
        event.preventDefault();
        cancelSessionEdit();
      }
    });

    refresh();
    return tr;
  }

  function updateRunningUI() {
    if (running) {
      var elapsed = fmtDuration(Date.now() - running.start);
      var task = findTask(running.taskId);
      if (task && runningTimeCell) runningTimeCell.textContent = fmtDuration(taskTotal(task, Date.now()));
      if (Date.now() >= statusHoldUntil) statusEl.textContent = 'Running \u00b7 ' + elapsed;
      document.title = '\u25cf ' + elapsed + ' \u2014 Time Tracker';
    } else {
      document.title = 'Time Tracker';
      if (Date.now() >= statusHoldUntil) {
        var open = openTasks().length;
        var archived = doneTasks().length;
        statusEl.textContent = open + ' open \u00b7 ' + archived + ' archived';
      }
    }
  }

  function setStatus(message) {
    statusEl.textContent = message;
    statusHoldUntil = Date.now() + MESSAGE_HOLD_MS;
  }

  function addTask() {
    var name = clean(taskInput.value);
    if (!name) { setStatus('Type a task name'); taskInput.focus(); return; }
    tasks.push({
      id: uid(),
      name: name,
      status: 'open',
      createdAt: Date.now(),
      doneAt: null,
      sessions: []
    });
    taskInput.value = '';
    write();
    render();
    setStatus('Added');
    taskInput.focus();
  }

  function startTimer(taskId) {
    if (running) return;
    var task = findTask(taskId);
    if (!task || task.status === 'done') return;
    running = { taskId: taskId, start: Date.now() };
    write();
    render();
  }

  function stopTimer() {
    if (!running) return;
    var task = findTask(running.taskId);
    if (task) task.sessions.push({ id: uid(), start: running.start, stop: Date.now() });
    running = null;
    write();
    render();
  }

  function markDone(taskId) {
    if (running && running.taskId === taskId) stopTimer();
    var task = findTask(taskId);
    if (!task) return;
    if (task.sessions.length === 0) { setStatus('Start the task first'); return; }
    task.status = 'done';
    task.doneAt = Date.now();
    if (renamingId === taskId) { renamingId = null; renameDraft = ''; }
    write();
    render();
    setStatus('Archived');
  }

  function restoreTask(taskId) {
    var task = findTask(taskId);
    if (!task) return;
    if (sessionEdit && sessionEdit.taskId === taskId) sessionEdit = null;
    task.status = 'open';
    task.doneAt = null;
    write();
    render();
    setStatus('Restored');
  }

  function deleteTask(taskId) {
    var task = findTask(taskId);
    if (!task) return;
    if (task.sessions.length && !window.confirm('Delete "' + task.name + '" and its ' + task.sessions.length + ' entr' + (task.sessions.length === 1 ? 'y' : 'ies') + '?')) return;
    if (running && running.taskId === taskId) running = null;
    tasks = tasks.filter(function (t) { return t.id !== taskId; });
    if (renamingId === taskId) { renamingId = null; renameDraft = ''; }
    write();
    render();
  }

  function deleteSession(taskId, sessionId) {
    var task = findTask(taskId);
    if (!task) return;
    task.sessions = task.sessions.filter(function (s) { return s.id !== sessionId; });
    if (sessionEdit && sessionEdit.sessionId === sessionId) sessionEdit = null;
    if (task.sessions.length === 0) {
      tasks = tasks.filter(function (t) { return t.id !== taskId; });
    }
    write();
    render();
  }

  function openRename(taskId) {
    var task = findTask(taskId);
    if (!task) return;
    renamingId = taskId;
    renameDraft = task.name;
    render();
    var box = document.querySelector('.renamerow input');
    if (box) { box.focus(); box.select(); }
  }

  function cancelRename() {
    renamingId = null;
    renameDraft = '';
    render();
  }

  function saveRename(taskId) {
    var task = findTask(taskId);
    if (!task) return;
    task.name = clean(renameDraft) || 'Untitled task';
    renamingId = null;
    renameDraft = '';
    write();
    render();
    setStatus('Renamed');
  }

  function openSessionEdit(taskId, sessionId) {
    var task = findTask(taskId);
    if (!task) return;
    var session = null;
    task.sessions.forEach(function (s) { if (s.id === sessionId) session = s; });
    if (!session) return;
    sessionEdit = {
      taskId: taskId,
      sessionId: sessionId,
      draft: { name: task.name, start: fmtInput(session.start), stop: fmtInput(session.stop) }
    };
    render();
    var box = document.querySelector('.sessrow input');
    if (box) box.focus();
  }

  function cancelSessionEdit() {
    sessionEdit = null;
    render();
  }

  function saveSessionEdit() {
    if (!sessionEdit) return;
    var task = findTask(sessionEdit.taskId);
    if (!task) { sessionEdit = null; render(); return; }
    var session = null;
    task.sessions.forEach(function (s) { if (s.id === sessionEdit.sessionId) session = s; });
    if (!session) { sessionEdit = null; render(); return; }

    var start = parseLocal(sessionEdit.draft.start);
    var stop = parseLocal(sessionEdit.draft.stop);

    if (isNaN(start)) { setStatus('Pick a valid start'); return; }
    if (isNaN(stop)) { setStatus('Pick a valid stop'); return; }
    if (stop <= start) { setStatus('Stop must be after Start'); return; }

    task.name = clean(sessionEdit.draft.name) || 'Untitled task';
    session.start = start;
    session.stop = stop;

    sessionEdit = null;
    write();
    render();
    setStatus('Updated');
  }

  function addManual() {
    var start = parseLocal(whenInput.value);
    var minutes = Number(minutesInput.value);

    if (isNaN(start)) {
      setStatus('Pick when it happened');
      whenInput.focus();
      return;
    }
    if (!isFinite(minutes) || minutes <= 0) {
      setStatus('Enter how long, in minutes');
      minutesInput.focus();
      return;
    }

    var duration = Math.round(minutes * 60000);
    var stop = start + duration;
    if (isNaN(new Date(stop).getTime())) {
      setStatus('That duration is out of range');
      minutesInput.focus();
      return;
    }

    tasks.push({
      id: uid(),
      name: clean(taskInput.value) || 'Untitled task',
      status: 'done',
      createdAt: start,
      doneAt: stop,
      sessions: [{ id: uid(), start: start, stop: stop }]
    });

    taskInput.value = '';
    whenInput.value = nowValue();
    minutesInput.value = '';

    write();
    render();
    setStatus('Added \u2014 ' + fmtDuration(duration));
    taskInput.focus();
  }

  function setManualOpen(open) {
    manualPanel.hidden = !open;
    addManBtn.textContent = open ? 'Close' : 'Add manually';
    addManBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) {
      whenInput.value = nowValue();
      whenInput.focus();
    }
  }

  function toggleManual() {
    setManualOpen(manualPanel.hidden);
  }

  function asTsv() {
    var lines = ['Task\tDate\tStart\tStop\tDuration'];
    archivedRows().forEach(function (pair) {
      lines.push([
        clean(pair.task.name),
        dateStr(pair.session.start),
        fmtDateTime(pair.session.start),
        fmtDateTime(pair.session.stop),
        fmtDuration(pair.session.stop - pair.session.start)
      ].join('\t'));
    });
    return lines.join('\n');
  }

  function legacyCopy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    if (ok) { done(); } else { setStatus('Copy blocked \u2014 select the table and copy manually'); }
  }

  function copyForExcel() {
    if (archivedRows().length === 0) { setStatus('Nothing archived to copy'); return; }
    var text = asTsv();
    var done = function () {
      setStatus('Copied \u2014 paste into Excel');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text, done); });
    } else {
      legacyCopy(text, done);
    }
  }

  function clearAll() {
    if (tasks.length === 0 && !running) return;
    if (!window.confirm(running ? 'Delete all tasks and stop the running timer?' : 'Delete all tasks and their entries?')) return;
    tasks = [];
    running = null;
    renamingId = null;
    renameDraft = '';
    sessionEdit = null;
    taskInput.value = '';
    write();
    render();
  }

  addTaskBtn.addEventListener('click', addTask);
  copyBtn.addEventListener('click', copyForExcel);
  clearBtn.addEventListener('click', clearAll);
  addManBtn.addEventListener('click', toggleManual);
  addBtn.addEventListener('click', addManual);
  fromInput.addEventListener('input', function () { renderArchived(); updateRunningUI(); });
  toInput.addEventListener('input', function () { renderArchived(); updateRunningUI(); });
  whenInput.addEventListener('keydown', manualEnter);
  minutesInput.addEventListener('keydown', manualEnter);
  taskInput.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    addTask();
  });

  function manualEnter(event) {
    if (event.key === 'Enter') { event.preventDefault(); addManual(); }
  }

  render();
  setInterval(updateRunningUI, 1000);
})();
</script>
</body>
</html>
